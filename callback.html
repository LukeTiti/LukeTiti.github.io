<!doctype html><html><head><meta charset="utf-8"><title>Tesla auth code</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b0b0f;color:#f0f0f0;padding:24px;line-height:1.6;max-width:760px;margin:0 auto}
code{background:#1c1c1e;padding:10px 12px;border-radius:8px;display:block;word-break:break-all;margin:8px 0;font-size:13px;border:1px solid #333}
h2{font-weight:700}.hint{color:#9aa}</style></head><body>
<h2>✅ Tesla authorization received</h2>
<p class="hint">Copy the <b>entire URL</b> below and paste it back into the chat/terminal:</p>
<code id="url"></code>
<p class="hint">(or just the authorization code)</p>
<code id="code"></code>
<script>
document.getElementById('url').textContent=window.location.href;
var p=new URLSearchParams(window.location.search);
document.getElementById('code').textContent=p.get('code')||'(no code in URL)';
</script></body></html>
